seed: 42

data:
  root: data/agriculture-vision
  image_size: 512
  num_classes: 7

model:
  architecture: unet
  encoder: resnet50
  encoder_weights: imagenet

training:
  epochs: 30
  batch_size: 8
  learning_rate: 0.0001
  weight_decay: 0.0001
  optimizer: adamw
  scheduler: cosine

loss:
  ce_weight: 1.0
  dice_weight: 1.0

classes:
  - background
  - cloud_shadow
  - double_plant
  - planter_skip
  - standing_water
  - waterway
  - weed_cluster
